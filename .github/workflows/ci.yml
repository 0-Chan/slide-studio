name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.27.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # playwright-chromium is an allowed build dependency, and its postinstall
      # downloads Chromium. Playwright 1.59.1 has no ubuntu-26.04 build, and CI
      # does not export PDF or PPTX, so skip that download.
      - run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - run: pnpm test
      - run: pnpm build
